<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haning 教學入口</title>
<meta name="description" content="Haning Chen 的教學網站入口：資訊科技教學網、教學部落格、元宇宙沈浸式體驗課程、英文學習工具與 GitHub。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f6f1;
    --bg-grid:rgba(30,70,40,.06);
    --surface:#ffffff;
    --ink:#16241a;
    --muted:#5b6b5f;
    --line:#dde4da;
    --accent:#2f7d4a;      /* 松高綠 */
    --accent-2:#8cc63f;    /* 淺綠 */
    --shadow:0 1px 2px rgba(16,40,24,.06),0 4px 14px rgba(16,40,24,.05);
    --shadow-hover:0 10px 30px rgba(20,70,40,.16),0 2px 6px rgba(20,70,40,.08);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1511;
      --bg-grid:rgba(140,198,63,.05);
      --surface:#171f1a;
      --ink:#e6eee7;
      --muted:#93a597;
      --line:#26322a;
      --accent:#5fbf7f;
      --accent-2:#a6dc5c;
      --shadow:0 1px 2px rgba(0,0,0,.4);
      --shadow-hover:0 12px 32px rgba(0,0,0,.5),0 0 0 1px rgba(95,191,127,.25);
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
    color:var(--ink);
    background-color:var(--bg);
    background-image:
      linear-gradient(var(--bg-grid) 1px,transparent 1px),
      linear-gradient(90deg,var(--bg-grid) 1px,transparent 1px);
    background-size:28px 28px;
    line-height:1.6;
    min-height:100vh;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:56px 20px 40px}

  /* ---------- 頁首 ---------- */
  header{margin-bottom:44px}
  .eyebrow{
    font-family:"JetBrains Mono",ui-monospace,monospace;
    font-size:13px;color:var(--accent);letter-spacing:.04em;
    display:inline-flex;align-items:center;gap:8px;
  }
  .eyebrow::before{
    content:"";width:8px;height:8px;border-radius:50%;
    background:var(--accent-2);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent-2) 25%,transparent);
  }
  h1{
    font-size:clamp(32px,6vw,52px);font-weight:900;line-height:1.15;
    margin:12px 0 10px;letter-spacing:-.01em;
  }
  h1 span{color:var(--accent)}
  .lead{color:var(--muted);font-size:17px;max-width:40em;margin:0}

  /* ---------- 分區 ---------- */
  section{margin-top:40px}
  .sec-head{
    display:flex;align-items:baseline;gap:12px;margin-bottom:16px;
    border-bottom:1px dashed var(--line);padding-bottom:10px;
  }
  .sec-head h2{font-size:18px;margin:0;font-weight:700}
  .sec-head small{
    font-family:"JetBrains Mono",ui-monospace,monospace;
    color:var(--muted);font-size:12px;
  }

  .grid{
    display:grid;gap:18px;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  }

  /* ---------- 卡片 ---------- */
  .card{
    position:relative;display:flex;flex-direction:column;gap:12px;
    padding:22px 22px 18px;border-radius:16px;
    background:var(--surface);border:1px solid var(--line);
    box-shadow:var(--shadow);
    color:inherit;text-decoration:none;overflow:hidden;
    transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s;
  }
  /* 左側色條：hover 時由上往下長出 */
  .card::before{
    content:"";position:absolute;left:0;top:0;width:4px;height:100%;
    background:linear-gradient(var(--accent),var(--accent-2));
    transform:scaleY(0);transform-origin:top;transition:transform .3s ease;
  }
  /* 背景光暈：跟著滑鼠位置 */
  .card::after{
    content:"";position:absolute;inset:0;pointer-events:none;opacity:0;
    background:radial-gradient(360px circle at var(--mx,50%) var(--my,50%),
      color-mix(in srgb,var(--accent-2) 14%,transparent),transparent 60%);
    transition:opacity .3s;
  }
  .card:hover,.card:focus-visible{
    transform:translateY(-6px);
    box-shadow:var(--shadow-hover);
    border-color:color-mix(in srgb,var(--accent) 45%,var(--line));
    outline:none;
  }
  .card:hover::before,.card:focus-visible::before{transform:scaleY(1)}
  .card:hover::after{opacity:1}

  .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .icon{
    width:46px;height:46px;border-radius:12px;display:grid;place-items:center;
    background:color-mix(in srgb,var(--accent) 12%,transparent);
    color:var(--accent);
    transition:transform .3s,background .3s,color .3s;
  }
  .icon svg{width:24px;height:24px}
  .card:hover .icon{
    transform:rotate(-6deg) scale(1.08);
    background:var(--accent);color:#fff;
  }
  .badge{
    font-family:"JetBrains Mono",ui-monospace,monospace;
    font-size:11px;padding:3px 9px;border-radius:999px;
    border:1px solid var(--line);color:var(--muted);white-space:nowrap;
  }
  .card h3{margin:0;font-size:19px;font-weight:700;line-height:1.35}
  .card p{margin:0;color:var(--muted);font-size:14.5px;flex:1}
  .foot{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding-top:12px;border-top:1px solid var(--line);
    font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;color:var(--muted);
  }
  .foot .url{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .arrow{
    flex:none;color:var(--accent);font-weight:700;
    transition:transform .25s;
  }
  .card:hover .arrow{transform:translateX(5px)}

  footer{
    margin-top:60px;padding-top:18px;border-top:1px solid var(--line);
    display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;
    color:var(--muted);font-size:13px;
  }
  footer a{color:var(--accent);text-decoration:none}
  footer a:hover{text-decoration:underline}

  @media (prefers-reduced-motion: reduce){
    *{transition:none!important}
    .card:hover{transform:none}
  }
  @media (max-width:480px){
    .wrap{padding:40px 16px 32px}
    .grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">haning47.github.io</div>
    <h1>Haning 的<span>教學入口</span></h1>
    <p class="lead">資訊科技教材、教學部落格、元宇宙課程與英文學習工具，全部從這裡出發。</p>
  </header>

  <main id="app"></main>

  <footer>
    <span>© <span id="year"></span> Haning Chen · 臺北市立松山高中</span>
    <a href="https://github.com/haning47" target="_blank" rel="noopener">github.com/haning47</a>
  </footer>
</div>

<script>
/* =========================================================

const ICONS = {
  code:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/><line x1="14" y1="4" x2="10" y2="20"/></svg>',
  blog:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  cube:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.7Z"/><polyline points="3.3 7 12 12 20.7 7"/><line x1="12" y1="22" x2="12" y2="12"/></svg>',
  vr:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-4l-2-3h-2l-2 3H5a2 2 0 0 1-2-2Z"/><circle cx="8" cy="11.5" r="1.5"/><circle cx="16" cy="11.5" r="1.5"/></svg>',
  cards:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3" width="14" height="16" rx="2"/><path d="M3 7v12a2 2 0 0 0 2 2h10"/><path d="M11 9h6M11 13h4"/></svg>',
  ai:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 4.6L18.5 9.5l-4.6 1.9L12 16l-1.9-4.6L5.5 9.5l4.6-1.9Z"/><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8Z"/></svg>',
  school:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"/><line x1="22" y1="10" x2="22" y2="16"/></svg>',
  archive:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="5" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><line x1="10" y1="12" x2="14" y2="12"/></svg>',
  github:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-3.2 19.5c.5.1.7-.2.7-.5v-1.7c-2.8.6-3.4-1.3-3.4-1.3-.4-1.2-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.5 2.3 1.1 2.9.8.1-.6.3-1.1.6-1.3-2.2-.3-4.6-1.1-4.6-5 0-1.1.4-2 1-2.7-.1-.3-.4-1.3.1-2.7 0 0 .8-.3 2.8 1a9.6 9.6 0 0 1 5 0c1.9-1.3 2.8-1 2.8-1 .5 1.4.2 2.4.1 2.7.6.7 1 1.6 1 2.7 0 3.9-2.4 4.7-4.6 5 .4.3.7.9.7 1.9v2.8c0 .3.2.6.7.5A10 10 0 0 0 12 2Z"/></svg>'
};

function host(u){
  try{ const x = new URL(u); return x.host + x.pathname.replace(/\/$/,""); }
  catch{ return u; }
}
function esc(s){
  return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}

document.getElementById("app").innerHTML = SECTIONS.map(sec => `
  <section>
    <div class="sec-head"><h2>${esc(sec.title)}</h2><small>${esc(sec.tag)}</small></div>
    <div class="grid">
      ${sec.items.map(it => `
        <a class="card" href="${esc(it.url)}" target="_blank" rel="noopener">
          <div class="top">
            <div class="icon">${ICONS[it.icon] || ICONS.code}</div>
            <span class="badge">${esc(it.badge)}</span>
          </div>
          <h3>${esc(it.name)}</h3>
          <p>${esc(it.desc)}</p>
          <div class="foot">
            <span class="url">${esc(decodeURIComponent(host(it.url)))}</span>
            <span class="arrow">→</span>
          </div>
        </a>`).join("")}
    </div>
  </section>`).join("");

/* 光暈跟隨滑鼠 */
document.querySelectorAll(".card").forEach(card => {
  card.addEventListener("pointermove", e => {
    const r = card.getBoundingClientRect();
    card.style.setProperty("--mx", (e.clientX - r.left) + "px");
    card.style.setProperty("--my", (e.clientY - r.top) + "px");
  });
});

document.getElementById("year").textContent = new Date().getFullYear();
</script>
</body>
</html>
